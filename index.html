<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator Demo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .header {
      background: #0b0f19;
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
    }

    .game {
      margin: 30px auto;
      max-width: 500px;
      padding: 25px;
    }

    .multiplier {
      font-size: 65px;
      font-weight: bold;
      color: #22c55e;
      margin: 50px 0;
    }

    .plane {
      font-size: 70px;
      transition: transform 0.3s;
    }

    button {
      background: #22c55e;
      color: white;
      border: none;
      padding: 15px 35px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
    }

    .info {
      margin-top: 25px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="header">✈️ AVIATOR DEMO</div>

  <div class="game">

    <div class="plane" id="plane">✈️</div>

    <div class="multiplier" id="multiplier">1.00x</div>

    <button id="startButton" onclick="startGame()">
      START ROUND
    </button>

    <div class="info" id="status">
      Demo game — no real money
    </div>

  </div>

<script>

let multiplier = 1.00;
let running = false;
let timer;

function startGame() {

  if (running) return;

  running = true;
  multiplier = 1.00;

  document.getElementById("startButton").disabled = true;
  document.getElementById("status").innerText = "Round running...";

  // Random crash point for this DEMO only
  let crashPoint = 1.10 + Math.random() * 8.90;

  timer = setInterval(function() {

    multiplier += 0.01;

    document.getElementById("multiplier").innerText =
      multiplier.toFixed(2) + "x";

    document.getElementById("plane").style.transform =
      "translateY(-" + (multiplier * 8) + "px)";

    if (multiplier >= crashPoint) {

      clearInterval(timer);

      document.getElementById("status").innerText =
        "💥 CRASHED at " + multiplier.toFixed(2) + "x";

      document.getElementById("startButton").disabled = false;

      running = false;
    }

  }, 100);

}

</script>

</body>
</html>
